<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17243c"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d2ff" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="620"/>
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="300" y1="0" x2="300" y2="620"/>
    <line x1="400" y1="0" x2="400" y2="620"/>
    <line x1="500" y1="0" x2="500" y2="620"/>
    <line x1="600" y1="0" x2="600" y2="620"/>
    <line x1="700" y1="0" x2="700" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
  </g>

  <!-- Header Banner -->
  <text x="450" y="45" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    PHISHAWARE SYSTEM &amp; NETWORK ARCHITECTURE
  </text>
  <text x="450" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Controlled Educational Phishing Awareness Simulation &amp; SOC Incident Response
  </text>

  <!-- TIER 1: Presentation Tier / Test User Browser -->
  <g transform="translate(250, 95)">
    <rect width="400" height="75" rx="8" fill="url(#cardGrad)" stroke="#00d2ff" stroke-width="2" filter="url(#glowCyan)"/>
    <rect width="400" height="75" rx="8" fill="url(#cardGrad)" stroke="#00d2ff" stroke-width="1.5"/>
    <circle cx="35" cy="37" r="18" fill="#00d2ff" fill-opacity="0.15"/>
    <text x="35" y="42" font-family="'Inter', sans-serif" font-size="16" fill="#00d2ff" text-anchor="middle">💻</text>
    <text x="70" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Test User Browser (Synthetic Client)
    </text>
    <text x="70" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">
      Webmail Client &bull; Simulated Emails &bull; Safe Landing &bull; Training Portal
    </text>
  </g>

  <!-- Arrow 1: User to Flask Web App -->
  <line x1="450" y1="172" x2="450" y2="218" stroke="#00d2ff" stroke-width="2.5" marker-end="url(#arrowCyan)" stroke-dasharray="4,4"/>
  <rect x="470" y="180" width="160" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="550" y="196" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#00d2ff" text-anchor="middle">
    HTTP / JSON Telemetry
  </text>

  <!-- TIER 2: Application Tier / Flask Web App -->
  <g transform="translate(150, 222)">
    <rect width="600" height="240" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Title Bar -->
    <path d="M 0,10 Q 0,0 10,0 L 590,0 Q 600,0 600,10 L 600,45 L 0,45 Z" fill="#1e293b"/>
    <text x="25" y="28" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      🛡️ Flask Core Application Server (Python 3.13)
    </text>
    <text x="575" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" text-anchor="end">
      REST API + Jinja2 Engine
    </text>

    <!-- Sub-Modules Grid -->
    <!-- Module 1: Simulation Engine -->
    <g transform="translate(25, 60)">
      <rect width="260" height="70" rx="6" fill="#0a0e17" stroke="#1e293b"/>
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#00d2ff">1. Simulation Engine</text>
      <text x="15" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Campaign Setup &bull; Scenario Gen</text>
      <text x="15" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Synthetic Recipient Dispatch</text>
    </g>

    <!-- Module 2: Awareness Pages -->
    <g transform="translate(315, 60)">
      <rect width="260" height="70" rx="6" fill="#0a0e17" stroke="#1e293b"/>
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#10b981">2. Awareness Gateway</text>
      <text x="15" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Safe Landing &bull; Indicator Breakdowns</text>
      <text x="15" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Interactive Red-Flag Mini-Quiz</text>
    </g>

    <!-- Module 3: Event Logger -->
    <g transform="translate(25, 145)">
      <rect width="260" height="75" rx="6" fill="#0a0e17" stroke="#1e293b"/>
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f59e0b">3. Telemetry Event Logger</text>
      <text x="15" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Safe Audit Stream &bull; Zero Harvest</text>
      <text x="15" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">SENT, OPEN, CLICK, REPORT Logs</text>
    </g>

    <!-- Module 4: Incident Response & Dashboard -->
    <g transform="translate(315, 145)">
      <rect width="260" height="75" rx="6" fill="#0a0e17" stroke="#1e293b"/>
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ef4444">4. Incident Response &amp; SOC</text>
      <text x="15" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Anomaly Detection &bull; Containment</text>
      <text x="15" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Eradication &bull; Recovery &bull; Reports</text>
    </g>
  </g>

  <!-- Arrow 2: Flask App to SQLite -->
  <line x1="450" y1="464" x2="450" y2="502" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <rect x="470" y="472" width="160" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="550" y="488" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">
    SQLAlchemy ORM (SQLite)
  </text>

  <!-- TIER 3: Data Tier / SQLite Event Store -->
  <g transform="translate(250, 508)">
    <rect width="400" height="85" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="35" cy="42" r="18" fill="#10b981" fill-opacity="0.15"/>
    <text x="35" y="47" font-family="'Inter', sans-serif" font-size="16" fill="#10b981" text-anchor="middle">🗄️</text>
    <text x="70" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      SQLite Event Store (database/app.db)
    </text>
    <text x="70" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      Tables: Campaign &bull; TestUser &bull; Event &bull; Incident &bull; IncidentAction
    </text>
    <text x="70" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#34d399">
      🔒 Hardened: Zero password fields &bull; Parameterized SQL &bull; Localhost
    </text>
  </g>
</svg>
