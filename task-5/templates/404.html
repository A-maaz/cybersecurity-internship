{% extends 'base.html' %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="soc-card p-5">
            <i class="bi bi-shield-slash text-warning display-1 mb-3"></i>
            <h1 class="h2 text-white fw-bold mb-2">404 — Route Not Found</h1>
            <p class="text-secondary mb-4">
                The requested endpoint does not exist within the PhishAware training environment.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('main.index') }}" class="btn btn-soc-cyan">
                    <i class="bi bi-house-door me-1"></i> Return Home
                </a>
                <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn btn-soc-outline">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
